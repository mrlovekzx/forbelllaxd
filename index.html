<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ตั๋วพิเศษสำหรับคนพิเศษ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="hero">🎟️</div>
      <h1>ตั๋วพิเศษสำหรับคนพิเศษ</h1>
      <p>แตะปุ่มใช้ตั๋ว เมื่ออยากได้ตั๋วใบไหนก็ได้เลยนะ</p>
      <div class="count">ใช้ไปแล้ว <b id="n">0</b> จาก <span id="t">6</span> ใบ</div>
    </header>

    <section id="list" aria-label="รายการตั๋ว"></section>

    <footer>ตั๋วทุกใบมีสิทธิ์ใช้เมื่อไหร่ก็ได้ ทำให้ด้วยความรัก 💗</footer>
  </main>

  <dialog id="dlg">
    <div class="big" id="dE"></div>
    <h3 id="dT"></h3>
    <p>ใช้ตั๋วใบนี้เลยไหม</p>
    <div class="row">
      <button class="no-btn" id="dNo">ยังก่อน</button>
      <button class="yes-btn" id="dYes">ใช้เลย</button>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
